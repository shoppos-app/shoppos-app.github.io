<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online shop</title>
<meta name="theme-color" content="#0B1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:"Rudaw"; src:url("Rudaw-Regular.ttf") format("truetype"); font-display:swap; }
  :root {
    --ink:#0B1220; --ink2:#1C2740; --green:#059669; --green2:#047857; --mint:#ECFDF5;
    --muted:#64748B; --bg:#F3F5F9; --border:#E7EBF1; --danger:#E5484D; --gold:#F5B83D;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; background:var(--bg); color:var(--ink); }
  body { font-family:"Rudaw","Noto Sans Arabic","Inter",system-ui,sans-serif; line-height:1.55; padding-bottom:110px; }
  body[dir=ltr] { font-family:"Inter","Noto Sans Arabic",system-ui,sans-serif; }
  button { font:inherit; cursor:pointer; border:0; }
  input,select,textarea { font:inherit; }
  .hidden { display:none !important; }

  header { background:linear-gradient(135deg,var(--ink),var(--ink2)); color:#fff; padding:22px 18px 46px; }
  .top { max-width:1100px; margin:0 auto; display:flex; align-items:center; gap:14px; }
  .logo { width:54px; height:54px; border-radius:18px; background:var(--green); display:grid; place-items:center; font-size:26px; font-weight:800; flex:none; }
  .shopname { font-size:1.45rem; font-weight:800; margin:0; }
  .sub { color:#cbd5e1; font-size:.9rem; }
  .langs { margin-inline-start:auto; display:flex; gap:6px; }
  .langs button { background:rgba(255,255,255,.1); color:#fff; padding:6px 10px; border-radius:10px; font-size:.85rem; }
  .langs button.on { background:#fff; color:var(--ink); font-weight:800; }
  .contact { max-width:1100px; margin:12px auto 0; display:flex; gap:8px; flex-wrap:wrap; }
  .contact a { color:#fff; text-decoration:none; background:rgba(255,255,255,.1); padding:7px 12px; border-radius:12px; font-size:.9rem; }

  main { max-width:1100px; margin:-28px auto 0; padding:0 14px; }
  .search { background:#fff; border-radius:18px; box-shadow:0 8px 24px rgba(15,23,42,.08); display:flex; align-items:center; padding:4px 14px; gap:8px; }
  .search input { border:0; outline:0; flex:1; padding:12px 4px; font-size:1rem; background:transparent; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:14px 2px 6px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { background:#fff; border:1px solid var(--border); padding:7px 14px; border-radius:999px; white-space:nowrap; color:var(--ink); }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); font-weight:800; }

  .notice { background:#FFF7E8; border:1px solid #F5D18B; color:#7A4E00; padding:14px 16px; border-radius:16px; margin:14px 0; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(160px,1fr)); gap:12px; margin-top:8px; }
  .card { background:#fff; border-radius:20px; overflow:hidden; box-shadow:0 6px 18px rgba(15,23,42,.06); display:flex; flex-direction:column; }
  .ph { aspect-ratio:1/1; background:#EEF2F7; display:grid; place-items:center; color:#94A3B8; font-size:2.4rem; font-weight:800; overflow:hidden; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; }
  .ph { position:relative; }
  .off { position:absolute; top:8px; inset-inline-start:8px; background:#E5484D; color:#fff; font-weight:800; font-size:.85rem; padding:3px 9px; border-radius:999px; box-shadow:0 4px 10px rgba(229,72,77,.35); }
  .oldp { color:var(--muted); text-decoration:line-through; font-size:.85rem; font-weight:600; margin-inline-start:6px; }
  .until { color:#E5484D; font-size:.78rem; font-weight:700; }
  .chip.offers { border-color:#E5484D; color:#E5484D; font-weight:800; }
  .chip.offers.on { background:#E5484D; color:#fff; }
  .info { padding:10px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .name { font-weight:700; font-size:.98rem; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.6em; }
  .price { color:var(--green); font-weight:800; font-size:1.05rem; }
  .out { color:var(--muted); font-size:.85rem; font-weight:600; }
  .add { margin-top:auto; background:var(--green); color:#fff; padding:9px; border-radius:12px; font-weight:800; }
  .add:disabled { background:#CBD5E1; }
  .stepper { margin-top:auto; display:flex; align-items:center; justify-content:space-between; background:var(--mint); border-radius:12px; padding:3px; }
  .stepper button { width:36px; height:36px; border-radius:10px; background:#fff; color:var(--green2); font-size:1.3rem; font-weight:800; }
  .stepper span { font-weight:800; }

  .cartbar { position:fixed; inset-inline:12px; bottom:calc(12px + env(safe-area-inset-bottom)); max-width:720px; margin:0 auto; background:var(--ink); color:#fff; border-radius:20px; padding:12px 14px 12px 18px; display:flex; align-items:center; gap:12px; box-shadow:0 12px 30px rgba(11,18,32,.35); z-index:10; }
  .cartbar .count { background:var(--green); border-radius:12px; padding:4px 10px; font-weight:800; }
  .cartbar .total { font-weight:800; font-size:1.1rem; }
  .cartbar button { margin-inline-start:auto; background:var(--green); color:#fff; padding:11px 18px; border-radius:14px; font-weight:800; }

  /* Cart and checkout open as a normal full page (scrolls well on iPhone and Android,
     also with the keyboard open). */
  .sheet-bg { background:var(--bg); min-height:100vh; }
  .sheet { background:#fff; width:100%; max-width:720px; margin:0 auto; min-height:100vh; padding:12px 18px calc(40px + env(safe-area-inset-bottom)); }
  .sheet-top { position:sticky; top:0; background:#fff; z-index:2; display:flex; align-items:center; gap:10px; padding:10px 0; margin-bottom:6px; border-bottom:1px solid var(--border); }
  .sheet-top button { width:42px; height:42px; border-radius:14px; background:var(--bg); font-size:1.3rem; font-weight:800; color:var(--ink); }
  .sheet-top b { font-size:1.05rem; }
  body.page-open header, body.page-open main, body.page-open .cartbar { display:none !important; }
  body.page-open { padding-bottom:0; }
  .sheet h2 { margin:4px 0 12px; font-size:1.25rem; }
  .line { display:flex; align-items:center; gap:10px; padding:10px 0; border-bottom:1px solid var(--border); }
  .line .ln { flex:1; font-weight:600; }
  .line .lp { font-weight:800; white-space:nowrap; }
  .mini { display:flex; align-items:center; gap:6px; }
  .mini button { width:30px; height:30px; border-radius:9px; background:var(--bg); font-weight:800; font-size:1.1rem; }
  .row { display:flex; justify-content:space-between; padding:6px 0; }
  .row.big { font-size:1.15rem; font-weight:800; }
  label { display:block; font-weight:700; margin:12px 0 6px; font-size:.95rem; }
  .field { width:100%; border:1.5px solid var(--border); background:#F8FAFC; border-radius:14px; padding:12px 14px; outline:0; }
  .field:focus { border-color:var(--green); background:#fff; }
  textarea.field { min-height:80px; resize:vertical; }
  .btn { width:100%; background:linear-gradient(135deg,var(--green),var(--green2)); color:#fff; padding:15px; border-radius:16px; font-weight:800; font-size:1.05rem; margin-top:16px; }
  .btn.light { background:var(--bg); color:var(--ink); }
  .btn:disabled { opacity:.6; }
  .err { color:var(--danger); font-weight:600; margin-top:10px; }
  .cod { background:var(--mint); color:var(--green2); padding:10px 14px; border-radius:14px; font-weight:700; margin-top:12px; }

  .center { text-align:center; padding:60px 20px; color:var(--muted); }
  .done { text-align:center; padding:16px 6px; }
  .done .big { font-size:3.4rem; }
  .spinner { width:36px; height:36px; border:4px solid #CBD5E1; border-top-color:var(--green); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 12px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:26px 10px 10px; }
  footer a { color:var(--muted); }
</style>
</head>
<body dir="rtl">

<header>
  <div class="top">
    <div class="logo" id="logo">🛒</div>
    <div>
      <h1 class="shopname" id="shopName">…</h1>
      <div class="sub" id="shopSub"></div>
    </div>
    <div class="langs">
      <button data-l="ckb">کوردی</button>
      <button data-l="ar">عربي</button>
      <button data-l="en">EN</button>
    </div>
  </div>
  <div class="contact" id="contact"></div>
</header>

<main>
  <div class="search"><span>🔍</span><input id="q" type="search" autocomplete="off"></div>
  <div class="chips" id="chips"></div>
  <div id="notice" class="notice hidden"></div>
  <div id="state" class="center"><div class="spinner"></div><div id="stateText"></div></div>
  <div class="grid" id="grid"></div>
  <footer><span id="powered"></span> · <a href="../privacy.html" id="privacyLink"></a></footer>
</main>

<div class="cartbar hidden" id="cartbar">
  <span class="count" id="cartCount">0</span>
  <span class="total" id="cartTotal"></span>
  <button id="openCart"></button>
</div>

<div class="sheet-bg hidden" id="sheetBg">
  <div class="sheet" id="sheet"></div>
</div>

<script>
const API_KEY = 'AIzaSyADBCkhPUUJHeDNGp1WYi9zJjAXiJA9m14';
const PROJECT = 'shop-pos-fc953';
const BASE = `https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents`;

const T = {
  en: { loading:'Loading…', notFound:'This shop was not found. Check the link.', closed:'This shop is not taking orders right now.',
        search:'Search items', all:'All', add:'Add', out:'Out of stock', viewCart:'View cart', cart:'Your cart', empty:'Your cart is empty',
        subtotal:'Items', fee:'Delivery', total:'Total', checkout:'Checkout', name:'Your name', phone:'Phone number', city:'City',
        chooseCity:'Choose your city', address:'Full address', addressHint:'Area, street, nearest landmark…', note:'Note (optional)',
        cod:'💵 Pay cash on delivery', send:'Send order', sending:'Sending…', back:'Back', fill:'Please fill in your name, phone, city and address.',
        badPhone:'Please enter a correct phone number.', failed:'Could not send the order. Check the internet and try again.',
        refused:'The shop is not taking orders right now.', doneTitle:'Order received!', doneText:'Thank you. The shop will call you soon to confirm your order.',
        again:'Order something else', call:'Call', powered:'Online shop', privacy:'Privacy', items:'items', free:'Free', offers:'🔥 Offers', until:'Offer until' },
  ar: { loading:'جارٍ التحميل…', notFound:'لم يتم العثور على هذا المتجر. تحقق من الرابط.', closed:'هذا المتجر لا يستقبل الطلبات حالياً.',
        search:'ابحث عن المواد', all:'الكل', add:'أضف', out:'غير متوفر', viewCart:'عرض السلة', cart:'سلتك', empty:'سلتك فارغة',
        subtotal:'المواد', fee:'التوصيل', total:'المجموع', checkout:'إتمام الطلب', name:'اسمك', phone:'رقم الهاتف', city:'المدينة',
        chooseCity:'اختر مدينتك', address:'العنوان الكامل', addressHint:'المنطقة، الشارع، أقرب نقطة دالة…', note:'ملاحظة (اختياري)',
        cod:'💵 الدفع نقداً عند الاستلام', send:'أرسل الطلب', sending:'جارٍ الإرسال…', back:'رجوع', fill:'يرجى إدخال الاسم والهاتف والمدينة والعنوان.',
        badPhone:'يرجى إدخال رقم هاتف صحيح.', failed:'تعذر إرسال الطلب. تحقق من الإنترنت وحاول مرة أخرى.',
        refused:'المتجر لا يستقبل الطلبات حالياً.', doneTitle:'تم استلام طلبك!', doneText:'شكراً لك. سيتصل بك المتجر قريباً لتأكيد الطلب.',
        again:'اطلب شيئاً آخر', call:'اتصال', powered:'متجر إلكتروني', privacy:'الخصوصية', items:'مواد', free:'مجاني', offers:'🔥 العروض', until:'العرض حتى' },
  ckb:{ loading:'چاوەڕێ بکە…', notFound:'ئەم فرۆشگایە نەدۆزرایەوە. لینکەکە بپشکنە.', closed:'ئەم فرۆشگایە ئێستا داواکاری وەرناگرێت.',
        search:'گەڕان بۆ کاڵا', all:'هەموو', add:'زیادکردن', out:'نەماوە', viewCart:'بینینی سەبەتە', cart:'سەبەتەکەت', empty:'سەبەتەکەت بەتاڵە',
        subtotal:'کاڵاکان', fee:'گەیاندن', total:'کۆی گشتی', checkout:'تەواوکردنی داواکاری', name:'ناوت', phone:'ژمارەی مۆبایل', city:'شار',
        chooseCity:'شارەکەت هەڵبژێرە', address:'ناونیشانی تەواو', addressHint:'گەڕەک، شەقام، نزیکترین شوێنی ناسراو…', note:'تێبینی (ئارەزوومەندانە)',
        cod:'💵 پارەدان بە نەقد لە کاتی گەیاندن', send:'ناردنی داواکاری', sending:'دەنێردرێت…', back:'گەڕانەوە', fill:'تکایە ناو، ژمارە، شار و ناونیشان بنووسە.',
        badPhone:'تکایە ژمارەیەکی دروست بنووسە.', failed:'داواکارییەکە نەنێردرا. ئینتەرنێت بپشکنە و دووبارە هەوڵبدەرەوە.',
        refused:'فرۆشگاکە ئێستا داواکاری وەرناگرێت.', doneTitle:'داواکارییەکەت گەیشت!', doneText:'سوپاس. فرۆشگاکە بەم زووانە پەیوەندیت پێوە دەکات بۆ دڵنیاکردنەوە.',
        again:'شتێکی تر داوا بکە', call:'پەیوەندی', powered:'فرۆشگای ئۆنلاین', privacy:'تایبەتمەندی', items:'کاڵا', free:'بەخۆڕایی', offers:'🔥 داشکاندن', until:'داشکاندن تا' },
};

const $ = (id) => document.getElementById(id);
const slug = (new URLSearchParams(location.search).get('s') || '').trim().toLowerCase();
let store = null, items = [], photos = {}, cart = {}, cat = '', lang = 'ckb', sending = false;
const loadedPacks = new Set(), loadingPacks = new Set();
// Photos are loaded in small packs only when the customer scrolls near them.
const io = ('IntersectionObserver' in window) ? new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); loadPack(Number(e.target.dataset.pk)); } });
}, { rootMargin: '600px' }) : null;

function store_get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function store_set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function t(k) { return (T[lang] || T.en)[k] || T.en[k] || k; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Firestore REST values
function dec(v) {
  if (!v || typeof v !== 'object') return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return Number(v.doubleValue);
  if ('booleanValue' in v) return v.booleanValue;
  if ('timestampValue' in v) return new Date(v.timestampValue);
  if ('nullValue' in v) return null;
  if ('mapValue' in v) { const o = {}; const f = v.mapValue.fields || {}; for (const k in f) o[k] = dec(f[k]); return o; }
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(dec);
  return null;
}
function enc(v, intKeys) {
  if (v === null || v === undefined) return { nullValue: null };
  if (v instanceof Date) return { timestampValue: v.toISOString() };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return { doubleValue: v };
  if (typeof v === 'string') return { stringValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(x => enc(x, intKeys)) } };
  const fields = {};
  for (const k in v) fields[k] = (intKeys && intKeys.includes(k) && typeof v[k] === 'number') ? { integerValue: String(Math.round(v[k])) } : enc(v[k], intKeys);
  return { mapValue: { fields } };
}
function fieldsOf(doc) { const o = {}; const f = (doc && doc.fields) || {}; for (const k in f) o[k] = dec(f[k]); return o; }

function money(n) {
  const d = (store && store.decimals) || 0;
  const s = new Intl.NumberFormat('en', { minimumFractionDigits: d, maximumFractionDigits: d }).format(n || 0);
  return `${s} ${(store && store.currency) || ''}`.trim();
}

function setLang(l) {
  lang = T[l] ? l : 'en';
  const rtl = lang !== 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = rtl ? 'rtl' : 'ltr';
  document.body.dir = rtl ? 'rtl' : 'ltr';
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  $('q').placeholder = t('search');
  $('stateText').textContent = t('loading');
  $('openCart').textContent = t('viewCart');
  $('powered').textContent = t('powered');
  $('privacyLink').textContent = t('privacy');
  store_set('shop_lang', lang);
  render();
}
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => setLang(b.dataset.l));
$('q').oninput = () => renderGrid();

async function load() {
  if (!slug) return showState(t('notFound'));
  try {
    const res = await fetch(`${BASE}/stores/${encodeURIComponent(slug)}?key=${API_KEY}`);
    if (res.status === 404 || res.status === 403) return showState(t('notFound'));
    if (!res.ok) throw new Error(res.status);
    store = fieldsOf(await res.json());
  } catch (e) { return showState(t('failed')); }
  items = (store.items || []).filter(i => i && i.n);
  applyOffers();
  cart = store_get(`cart_${slug}`, {});
  for (const k in cart) if (!items.find(i => String(i.k) === k)) delete cart[k];
  setLang(store_get('shop_lang', null) || store.lang || 'ckb');
  $('state').classList.add('hidden');
  document.title = store.shopName || 'Online shop';
  loadPhotos();
}

async function loadPack(i) {
  if (isNaN(i) || loadedPacks.has(i) || loadingPacks.has(i)) return;
  loadingPacks.add(i);
  try {
    const res = await fetch(`${BASE}/stores/${encodeURIComponent(slug)}/photos/${i}?key=${API_KEY}`);
    if (res.ok) { Object.assign(photos, fieldsOf(await res.json()).p || {}); loadedPacks.add(i); }
  } catch (e) {} finally { loadingPacks.delete(i); }
  renderGrid();
}

function observePhotos() {
  document.querySelectorAll('.ph[data-pk]').forEach(el => {
    const pk = Number(el.dataset.pk);
    if (loadedPacks.has(pk) || loadingPacks.has(pk)) return;
    if (io) io.observe(el); else loadPack(pk);
  });
}

function loadPhotos() {
  // Older shop data without pack numbers: load every pack.
  if (!items.some(i => i.pk !== undefined && i.pk !== null)) {
    for (let i = 0; i < (store.photoPacks || 0); i++) loadPack(i);
  }
}

// Discount from the shop app: d = percent, de = last day (yyyy-mm-dd). Ended offers are ignored.
function applyOffers() {
  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const f = Math.pow(10, (store && store.decimals) || 0);
  for (const i of items) {
    if (i.d > 0 && i.d < 100 && (!i.de || i.de >= today)) {
      i.op = i.p;
      i.p = Math.round(i.p * (100 - i.d) / 100 * f) / f;
    } else {
      i.d = 0;
    }
  }
}

function showState(text) {
  $('state').classList.remove('hidden');
  $('state').innerHTML = `<div style="font-size:2.6rem">🏪</div><div>${esc(text)}</div>`;
}

function render() {
  if (!store) return;
  $('shopName').textContent = store.shopName || '';
  $('logo').textContent = (store.shopName || '🛒').trim().charAt(0).toUpperCase() || '🛒';
  $('shopSub').textContent = `${items.length} ${t('items')}`;
  const phone = (store.phone || '').replace(/[^\d+]/g, '');
  $('contact').innerHTML = phone ? `<a href="tel:${esc(phone)}">📞 ${t('call')} ${esc(store.phone)}</a>` : '';
  $('notice').classList.toggle('hidden', !!store.open);
  $('notice').textContent = t('closed');
  renderChips();
  renderGrid();
  renderCartBar();
}

function renderChips() {
  const cats = [...new Set(items.map(i => i.c).filter(Boolean))];
  const hasOffers = items.some(i => i.d > 0);
  if (!hasOffers && cat === '__off') cat = '';
  $('chips').classList.toggle('hidden', cats.length === 0 && !hasOffers);
  $('chips').innerHTML = [['', t('all')], ...(hasOffers ? [['__off', t('offers')]] : []), ...cats.map(c => [c, c])]
    .map(([v, l]) => `<button class="chip ${v === '__off' ? 'offers' : ''} ${v === cat ? 'on' : ''}" data-c="${esc(v)}">${esc(l)}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => { cat = b.dataset.c; renderChips(); renderGrid(); });
}

function renderGrid() {
  if (!store) return;
  const q = $('q').value.trim().toLowerCase();
  const shown = items.filter(i => (!cat || (cat === '__off' ? i.d > 0 : i.c === cat)) && (!q || i.n.toLowerCase().includes(q)));
  $('grid').innerHTML = shown.map(i => {
    const k = String(i.k), qty = cart[k] || 0, ph = photos[k];
    const img = ph ? `<img loading="lazy" src="data:image/jpeg;base64,${ph}" alt="">` : esc(i.n.trim().charAt(0).toUpperCase());
    const pkAttr = (!ph && i.pk !== undefined && i.pk !== null) ? ` data-pk="${i.pk}"` : '';
    let action;
    if (!i.s) action = `<button class="add" disabled>${t('out')}</button>`;
    else if (qty > 0) action = `<div class="stepper"><button data-a="-" data-k="${k}">−</button><span>${qty}</span><button data-a="+" data-k="${k}">+</button></div>`;
    else action = `<button class="add" data-a="+" data-k="${k}" ${store.open ? '' : 'disabled'}>${t('add')}</button>`;
    const off = i.d > 0 ? `<span class="off">-${i.d}%</span>` : '';
    const old = i.d > 0 ? `<span class="oldp">${money(i.op)}</span>` : '';
    const until = i.d > 0 && i.de ? `<div class="until">${t('until')} ${esc(i.de)}</div>` : '';
    return `<div class="card"><div class="ph"${pkAttr}>${img}${off}</div><div class="info"><div class="name">${esc(i.n)}</div><div class="price">${money(i.p)}${old}</div>${until}${action}</div></div>`;
  }).join('');
  $('grid').querySelectorAll('[data-a]').forEach(b => b.onclick = () => change(b.dataset.k, b.dataset.a === '+' ? 1 : -1));
  observePhotos();
}

function change(k, d) {
  const n = Math.max(0, Math.min(99, (cart[k] || 0) + d));
  if (n === 0) delete cart[k]; else cart[k] = n;
  store_set(`cart_${slug}`, cart);
  renderGrid(); renderCartBar();
  if (!$('sheetBg').classList.contains('hidden')) openCart();
}

function cartLines() {
  return Object.entries(cart).map(([k, q]) => {
    const i = items.find(x => String(x.k) === k);
    return i ? { i, q } : null;
  }).filter(Boolean);
}
function subtotal() { return cartLines().reduce((s, l) => s + l.i.p * l.q, 0); }

function renderCartBar() {
  const lines = cartLines();
  const count = lines.reduce((s, l) => s + l.q, 0);
  $('cartbar').classList.toggle('hidden', count === 0);
  $('cartCount').textContent = count;
  $('cartTotal').textContent = money(subtotal());
}
$('openCart').onclick = () => openCart();

let savedScroll = 0;
function closeSheet() {
  $('sheetBg').classList.add('hidden');
  document.body.classList.remove('page-open');
  renderCartBar();
  window.scrollTo(0, savedScroll);
}
function showSheet() {
  const bg = $('sheetBg');
  const wasHidden = bg.classList.contains('hidden');
  if (wasHidden) savedScroll = window.scrollY;
  bg.classList.remove('hidden');
  document.body.classList.add('page-open');
  if (wasHidden) window.scrollTo(0, 0);
}
// Small top bar with a back arrow on the cart / checkout page.
function topBar(title, back) {
  const arrow = document.documentElement.dir === 'rtl' ? '→' : '←';
  return `<div class="sheet-top"><button id="topBack" aria-label="back">${arrow}</button><b>${esc(store.shopName || '')} · ${title}</b></div>`;
}
function wireTop(back) { const b = $('topBack'); if (b) b.onclick = back; }

function openCart() {
  const lines = cartLines();
  showSheet();
  if (!lines.length) {
    $('sheet').innerHTML = topBar(t('cart')) + `<div class="center">${t('empty')}</div><button class="btn light" id="b">${t('back')}</button>`;
    $('b').onclick = closeSheet;
    wireTop(closeSheet);
    return;
  }
  $('sheet').innerHTML = topBar(t('cart')) + lines.map(l => `
    <div class="line"><div class="ln">${esc(l.i.n)}<div class="out">${money(l.i.p)}</div></div>
    <div class="mini"><button data-a="-" data-k="${l.i.k}">−</button><b>${l.q}</b><button data-a="+" data-k="${l.i.k}">+</button></div>
    <div class="lp">${money(l.i.p * l.q)}</div></div>`).join('') +
    `<div class="row big" style="margin-top:8px"><span>${t('subtotal')}</span><span>${money(subtotal())}</span></div>
     <button class="btn" id="go" ${store.open ? '' : 'disabled'}>${t('checkout')}</button>
     <button class="btn light" id="b">${t('back')}</button>`;
  $('sheet').querySelectorAll('[data-a]').forEach(b => b.onclick = () => change(b.dataset.k, b.dataset.a === '+' ? 1 : -1));
  $('go').onclick = checkout;
  $('b').onclick = closeSheet;
  wireTop(closeSheet);
}

function checkout() {
  const saved = store_get('customer', {});
  const cities = (store.cities || []).filter(c => c && c.n);
  const cityField = cities.length
    ? `<select class="field" id="city"><option value="">${t('chooseCity')}</option>${cities.map((c, i) =>
        `<option value="${i}" ${saved.city === c.n ? 'selected' : ''}>${esc(c.n)} — ${c.f > 0 ? money(c.f) : t('free')}</option>`).join('')}</select>`
    : `<input class="field" id="city" value="${esc(saved.city || '')}">`;
  $('sheet').innerHTML = topBar(t('checkout')) + `
    <label>${t('name')}</label><input class="field" id="cn" maxlength="80" value="${esc(saved.name || '')}" autocomplete="name">
    <label>${t('phone')}</label><input class="field" id="cp" maxlength="20" inputmode="tel" dir="ltr" value="${esc(saved.phone || '')}" autocomplete="tel" placeholder="07xx xxx xxxx">
    <label>${t('city')}</label>${cityField}
    <label>${t('address')}</label><textarea class="field" id="ca" maxlength="300" placeholder="${t('addressHint')}">${esc(saved.address || '')}</textarea>
    <label>${t('note')}</label><input class="field" id="cnote" maxlength="200">
    <div class="cod">${t('cod')}</div>
    <div style="margin-top:12px">
      <div class="row"><span>${t('subtotal')}</span><span>${money(subtotal())}</span></div>
      <div class="row"><span>${t('fee')}</span><span id="feeV"></span></div>
      <div class="row big"><span>${t('total')}</span><span id="totV"></span></div>
    </div>
    <div class="err hidden" id="err"></div>
    <button class="btn" id="send">${t('send')}</button>
    <button class="btn light" id="b">${t('back')}</button>`;
  window.scrollTo(0, 0);
  wireTop(() => { if (!sending) openCart(); });
  const fee = () => {
    if (!cities.length) return 0;
    const i = $('city').value;
    return i === '' ? 0 : (cities[Number(i)].f || 0);
  };
  const upd = () => { $('feeV').textContent = fee() > 0 ? money(fee()) : t('free'); $('totV').textContent = money(subtotal() + fee()); };
  if (cities.length) $('city').onchange = upd;
  upd();
  $('b').onclick = () => { if (!sending) openCart(); };
  $('send').onclick = async () => {
    const name = $('cn').value.trim(), phone = $('cp').value.trim(), address = $('ca').value.trim(), note = $('cnote').value.trim();
    const cityName = cities.length ? ($('city').value === '' ? '' : cities[Number($('city').value)].n) : $('city').value.trim();
    const err = (m) => { $('err').textContent = m; $('err').classList.remove('hidden'); };
    if (!name || !phone || !cityName || !address) return err(t('fill'));
    const digits = phone.replace(/[^\d]/g, '');
    if (digits.length < 7 || digits.length > 15) return err(t('badPhone'));
    store_set('customer', { name, phone, city: cityName, address });
    const lines = cartLines();
    const sub = subtotal(), f = fee();
    const order = {
      storeSlug: slug, ownerUid: store.ownerUid, customerName: name, phone, city: cityName, fee: f,
      address, note, subtotal: sub, total: sub + f, status: 'new', createdAt: new Date(),
      items: lines.map(l => ({ k: Number(l.i.k), n: l.i.n, p: l.i.p, q: l.q })),
    };
    sending = true; $('send').disabled = true; $('send').textContent = t('sending');
    try {
      const fields = enc(order, ['k', 'q']).mapValue.fields;
      const res = await fetch(`${BASE}/orders?key=${API_KEY}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields }),
      });
      if (res.status === 403) { sending = false; $('send').disabled = false; $('send').textContent = t('send'); return err(t('refused')); }
      if (!res.ok) throw new Error(res.status);
      cart = {}; store_set(`cart_${slug}`, cart);
      renderGrid(); renderCartBar();
      $('sheet').innerHTML = `<div class="done"><div class="big">✅</div><h2>${t('doneTitle')}</h2><p class="out" style="font-size:1rem">${t('doneText')}</p>
        <div style="text-align:start;margin-top:14px">${lines.map(l => `<div class="row"><span>${l.q} × ${esc(l.i.n)}</span><span>${money(l.i.p * l.q)}</span></div>`).join('')}
        <div class="row"><span>${t('fee')}</span><span>${f > 0 ? money(f) : t('free')}</span></div>
        <div class="row big"><span>${t('total')}</span><span>${money(sub + f)}</span></div></div>
        <button class="btn" id="b">${t('again')}</button></div>`;
      window.scrollTo(0, 0);
      $('b').onclick = closeSheet;
    } catch (e) {
      $('send').disabled = false; $('send').textContent = t('send'); err(t('failed'));
    } finally { sending = false; }
  };
}

setLang(store_get('shop_lang', null) || 'ckb');
load();
</script>
</body>
</html>
