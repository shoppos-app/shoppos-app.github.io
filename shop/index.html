<!DOCTYPE html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Online shop</title>
<meta name="theme-color" content="#0B1220">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@400;600;800&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  @font-face { font-family:"Rudaw"; src:url("Rudaw-Regular.ttf") format("truetype"); font-display:swap; }
  :root {
    --ink:#0B1220; --ink2:#1C2740; --green:#059669; --green2:#047857; --green3:#34D399; --mint:#ECFDF5;
    --muted:#64748B; --bg:#F4F6FA; --card:#FFFFFF; --border:#E7EBF1; --danger:#E5484D; --orange:#F97316; --gold:#F5B83D;
    --r:22px; --shadow:0 10px 30px rgba(15,23,42,.07); --shadow2:0 18px 40px rgba(15,23,42,.13);
    --ease:cubic-bezier(.2,.8,.2,1);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html { scroll-behavior:smooth; }
  html,body { margin:0; background:var(--bg); color:var(--ink); }
  body { font-family:"Rudaw","Noto Sans Arabic","Inter",system-ui,sans-serif; line-height:1.55; padding-bottom:120px; -webkit-font-smoothing:antialiased; }
  body[dir=ltr] { font-family:"Inter","Noto Sans Arabic",system-ui,sans-serif; }
  button { font:inherit; cursor:pointer; border:0; }
  input,select,textarea { font:inherit; }
  a { color:inherit; }
  .hidden { display:none !important; }

  /* ───── hero ───── */
  header { position:relative; overflow:hidden; color:#fff; padding:20px 18px 70px;
    background:radial-gradient(1200px 400px at 85% -10%, rgba(52,211,153,.28), transparent 60%),
               radial-gradient(800px 380px at -10% 110%, rgba(59,130,246,.22), transparent 60%),
               linear-gradient(140deg,#0B1220 0%,#111C33 55%,#0E2A2A 100%); }
  header::after { content:""; position:absolute; inset:0; pointer-events:none; opacity:.07;
    background-image:radial-gradient(#fff 1px, transparent 1px); background-size:22px 22px; }
  .wrap { max-width:1120px; margin:0 auto; position:relative; z-index:1; }
  .bar { display:flex; align-items:center; gap:10px; }
  .langs { margin-inline-start:auto; display:flex; gap:4px; padding:4px; border-radius:14px; background:rgba(255,255,255,.08); backdrop-filter:blur(10px); border:1px solid rgba(255,255,255,.12); }
  .langs button { background:transparent; color:#cbd5e1; padding:6px 11px; border-radius:10px; font-size:.82rem; transition:all .25s var(--ease); }
  .langs button.on { background:#fff; color:var(--ink); font-weight:800; }
  .brandline { display:flex; align-items:center; gap:16px; margin-top:22px; }
  .logo { width:72px; height:72px; border-radius:24px; flex:none; display:grid; place-items:center; font-size:32px; font-weight:800;
    background:linear-gradient(135deg,var(--green3),var(--green)); box-shadow:0 12px 30px rgba(5,150,105,.45), inset 0 0 0 3px rgba(255,255,255,.25);
    animation:pop .7s var(--ease) both; }
  .shopname { font-size:clamp(1.5rem,4.5vw,2.2rem); font-weight:800; margin:0; line-height:1.2; animation:rise .7s .05s var(--ease) both; }
  .meta { display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin-top:8px; animation:rise .7s .12s var(--ease) both; }
  .pill { display:inline-flex; align-items:center; gap:7px; padding:5px 12px; border-radius:999px; font-size:.85rem; font-weight:700; background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.14); }
  .dot { width:8px; height:8px; border-radius:50%; background:var(--green3); box-shadow:0 0 0 0 rgba(52,211,153,.7); animation:pulse 2s infinite; }
  .pill.closed .dot { background:var(--danger); animation:none; }
  .actions { display:flex; gap:8px; flex-wrap:wrap; margin-top:18px; animation:rise .7s .18s var(--ease) both; }
  .act { display:inline-flex; align-items:center; gap:8px; text-decoration:none; padding:10px 16px; border-radius:14px; font-weight:800; font-size:.92rem; transition:transform .2s var(--ease), background .2s; }
  .act:active { transform:scale(.96); }
  .act.call { background:#fff; color:var(--ink); }
  .act.wa { background:#25D366; color:#fff; }
  .act.loc { background:rgba(255,255,255,.1); color:#fff; border:1px solid rgba(255,255,255,.16); }

  /* ───── main ───── */
  main { max-width:1120px; margin:-40px auto 0; padding:0 14px; position:relative; z-index:2; }
  .tools { position:sticky; top:0; z-index:5; padding:10px 0 4px; margin:0 -14px; padding-inline:14px; transition:background .3s, box-shadow .3s; }
  .tools.stuck { background:rgba(244,246,250,.82); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 8px 20px rgba(15,23,42,.06); }
  .search { background:#fff; border-radius:18px; box-shadow:var(--shadow); display:flex; align-items:center; padding:4px 16px; gap:10px; border:1.5px solid transparent; transition:border-color .2s, box-shadow .2s; }
  .search:focus-within { border-color:var(--green); box-shadow:0 10px 30px rgba(5,150,105,.15); }
  .search svg { flex:none; color:var(--muted); }
  .search input { border:0; outline:0; flex:1; padding:13px 2px; font-size:1rem; background:transparent; min-width:0; }
  .chips { display:flex; gap:8px; overflow-x:auto; padding:12px 2px 8px; scrollbar-width:none; }
  .chips::-webkit-scrollbar { display:none; }
  .chip { background:#fff; border:1px solid var(--border); padding:8px 16px; border-radius:999px; white-space:nowrap; color:var(--ink); font-weight:600; transition:all .25s var(--ease); }
  .chip:active { transform:scale(.95); }
  .chip.on { background:var(--ink); color:#fff; border-color:var(--ink); font-weight:800; box-shadow:0 6px 16px rgba(11,18,32,.25); }
  .chip.offers { border-color:#FECACA; color:var(--danger); font-weight:800; background:#FFF5F5; }
  .chip.offers.on { background:linear-gradient(135deg,var(--danger),var(--orange)); color:#fff; border-color:transparent; box-shadow:0 6px 16px rgba(229,72,77,.35); }

  .notice { display:flex; gap:10px; align-items:center; background:#FFF7E8; border:1px solid #F5D18B; color:#7A4E00; padding:14px 16px; border-radius:16px; margin:12px 0; font-weight:700; }
  .count-line { color:var(--muted); font-size:.88rem; font-weight:600; margin:6px 2px 10px; }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:14px; }
  @media (max-width:420px) { .grid { grid-template-columns:repeat(2,1fr); gap:10px; } }
  .card { background:var(--card); border-radius:var(--r); overflow:hidden; box-shadow:var(--shadow); display:flex; flex-direction:column; transition:transform .3s var(--ease), box-shadow .3s var(--ease); }
  .grid.anim .card { animation:rise .55s var(--ease) both; animation-delay:calc(var(--i) * 35ms); }
  @media (hover:hover) { .card:hover { transform:translateY(-4px); box-shadow:var(--shadow2); } .card:hover .ph img { transform:scale(1.06); } }
  .ph { position:relative; aspect-ratio:1/1; display:grid; place-items:center; overflow:hidden; color:#94A3B8; font-size:2.6rem; font-weight:800;
    background:linear-gradient(135deg,#EEF2F7,#E2E8F0); }
  .ph.wait::before { content:""; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.6) 50%,transparent 70%); background-size:200% 100%; animation:shimmer 1.3s infinite; }
  .ph img { width:100%; height:100%; object-fit:cover; display:block; transition:transform .5s var(--ease); animation:fade .4s ease both; }
  .off { position:absolute; top:10px; inset-inline-start:10px; background:linear-gradient(135deg,var(--danger),var(--orange)); color:#fff; font-weight:800; font-size:.85rem; padding:4px 10px; border-radius:999px; box-shadow:0 6px 14px rgba(229,72,77,.4); direction:ltr; }
  .soldout { position:absolute; inset:0; display:grid; place-items:center; background:rgba(255,255,255,.55); backdrop-filter:grayscale(1); color:var(--ink); font-size:.95rem; font-weight:800; }
  .info { padding:12px 13px 13px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .name { font-weight:700; font-size:.98rem; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; min-height:2.7em; }
  .prices { display:flex; align-items:baseline; flex-wrap:wrap; gap:4px 8px; }
  .price { color:var(--green2); font-weight:800; font-size:1.08rem; }
  .card.sale .price { color:var(--danger); }
  .oldp { color:var(--muted); text-decoration:line-through; font-size:.82rem; font-weight:600; }
  .until { color:var(--danger); font-size:.76rem; font-weight:700; }
  .out { color:var(--muted); font-size:.85rem; font-weight:600; }
  .act-slot { margin-top:auto; padding-top:2px; }
  .add { width:100%; display:flex; align-items:center; justify-content:center; gap:6px; background:linear-gradient(135deg,var(--green),var(--green2)); color:#fff; padding:10px; border-radius:14px; font-weight:800; box-shadow:0 6px 14px rgba(5,150,105,.25); transition:transform .15s var(--ease), box-shadow .2s; }
  .add:active { transform:scale(.96); }
  .add:disabled { background:#CBD5E1; box-shadow:none; }
  .stepper { display:flex; align-items:center; justify-content:space-between; background:var(--mint); border-radius:14px; padding:4px; animation:fade .25s ease both; }
  .stepper button { width:38px; height:38px; border-radius:11px; background:#fff; color:var(--green2); font-size:1.3rem; font-weight:800; box-shadow:0 2px 6px rgba(15,23,42,.06); transition:transform .15s; }
  .stepper button:active { transform:scale(.9); }
  .stepper span { font-weight:800; font-size:1.05rem; }
  .empty { grid-column:1/-1; text-align:center; color:var(--muted); padding:50px 10px; font-weight:600; }
  .empty div { font-size:2.6rem; margin-bottom:6px; }

  /* ───── pages ───── */
  .pager { display:flex; align-items:center; justify-content:center; gap:6px; flex-wrap:wrap; margin:26px 0 8px; }
  .pager button { min-width:42px; height:42px; padding:0 12px; border-radius:13px; background:#fff; color:var(--ink); font-weight:800; box-shadow:0 4px 12px rgba(15,23,42,.06); transition:all .25s var(--ease); }
  .pager button:active { transform:scale(.94); }
  .pager button.on { background:var(--ink); color:#fff; box-shadow:0 8px 18px rgba(11,18,32,.28); transform:translateY(-2px); }
  .pager button:disabled { opacity:.4; }
  .pager .nav { display:inline-flex; align-items:center; gap:6px; }
  .pager .gap { color:var(--muted); padding:0 2px; font-weight:800; }

  /* ───── footer ───── */
  .about { margin-top:34px; background:#fff; border-radius:26px; box-shadow:var(--shadow); padding:22px; display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(240px,1fr)); }
  .about h3 { margin:0 0 4px; font-size:1.15rem; grid-column:1/-1; }
  .ainfo { display:flex; gap:12px; align-items:flex-start; }
  .aicon { width:44px; height:44px; border-radius:14px; flex:none; display:grid; place-items:center; font-size:1.2rem; background:var(--mint); }
  .ainfo small { display:block; color:var(--muted); font-weight:600; font-size:.8rem; }
  .ainfo b { font-weight:700; word-break:break-word; }
  .ainfo a.btnmap { display:inline-flex; margin-top:8px; padding:7px 12px; border-radius:11px; background:var(--ink); color:#fff; font-weight:800; font-size:.85rem; text-decoration:none; }
  .made { margin:22px 0 4px; border-radius:24px; padding:18px 20px; color:#fff; display:flex; align-items:center; gap:14px; flex-wrap:wrap; text-decoration:none;
    background:linear-gradient(135deg,#0B1220,#123B33); box-shadow:0 14px 30px rgba(11,18,32,.25); }
  .made .mlogo { width:46px; height:46px; border-radius:15px; display:grid; place-items:center; font-size:1.4rem; background:linear-gradient(135deg,var(--green3),var(--green)); flex:none; }
  .made small { display:block; color:#94A3B8; font-size:.8rem; }
  .made b { font-size:1.1rem; }
  .made .go { margin-inline-start:auto; background:#fff; color:var(--ink); padding:9px 14px; border-radius:12px; font-weight:800; font-size:.88rem; }
  footer { text-align:center; color:var(--muted); font-size:.8rem; padding:16px 10px 6px; }
  footer a { color:var(--muted); }

  /* ───── cart bar ───── */
  .cartbar { position:fixed; inset-inline:12px; bottom:calc(14px + env(safe-area-inset-bottom)); max-width:720px; margin:0 auto; z-index:10;
    background:rgba(11,18,32,.92); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); color:#fff; border-radius:22px; padding:10px 10px 10px 16px;
    display:flex; align-items:center; gap:12px; box-shadow:0 16px 36px rgba(11,18,32,.38); animation:up .45s var(--ease) both; }
  .cartbar .count { background:linear-gradient(135deg,var(--green3),var(--green)); border-radius:12px; min-width:34px; height:34px; display:grid; place-items:center; font-weight:800; }
  .cartbar .count.bump { animation:bump .45s var(--ease); }
  .cartbar .total { font-weight:800; font-size:1.1rem; }
  .cartbar button { margin-inline-start:auto; background:#fff; color:var(--ink); padding:12px 18px; border-radius:15px; font-weight:800; }
  .toast { position:fixed; left:50%; top:calc(14px + env(safe-area-inset-top)); transform:translate(-50%,-220%); opacity:0; visibility:hidden; z-index:30; background:var(--ink); color:#fff; padding:10px 16px; border-radius:14px; font-weight:700; box-shadow:0 12px 26px rgba(11,18,32,.3); transition:transform .4s var(--ease), opacity .3s, visibility .3s; white-space:nowrap; }
  .toast.show { transform:translate(-50%,0); opacity:1; visibility:visible; }

  /* Cart and checkout open as a normal full page (scrolls well on iPhone and Android,
     also with the keyboard open). */
  .sheet-bg { background:var(--bg); min-height:100vh; }
  .sheet { background:#fff; width:100%; max-width:720px; margin:0 auto; min-height:100vh; padding:12px 18px calc(40px + env(safe-area-inset-bottom)); animation:fade .3s ease both; }
  .sheet-top { position:sticky; top:0; background:rgba(255,255,255,.9); backdrop-filter:blur(12px); z-index:2; display:flex; align-items:center; gap:10px; padding:10px 0; margin-bottom:6px; border-bottom:1px solid var(--border); }
  .sheet-top button { width:42px; height:42px; border-radius:14px; background:var(--bg); font-size:1.3rem; font-weight:800; color:var(--ink); }
  .sheet-top b { font-size:1.05rem; }
  body.page-open header, body.page-open main, body.page-open .cartbar { display:none !important; }
  body.page-open { padding-bottom:0; }
  .sheet h2 { margin:4px 0 12px; font-size:1.25rem; }
  .line { display:flex; align-items:center; gap:10px; padding:12px 0; border-bottom:1px solid var(--border); }
  .line .ln { flex:1; font-weight:700; }
  .line .lp { font-weight:800; white-space:nowrap; }
  .mini { display:flex; align-items:center; gap:8px; }
  .mini button { width:32px; height:32px; border-radius:10px; background:var(--bg); font-weight:800; font-size:1.1rem; }
  .row { display:flex; justify-content:space-between; padding:6px 0; }
  .row.big { font-size:1.15rem; font-weight:800; }
  label { display:block; font-weight:700; margin:14px 0 6px; font-size:.95rem; }
  .field { width:100%; border:1.5px solid var(--border); background:#F8FAFC; border-radius:14px; padding:13px 14px; outline:0; transition:border-color .2s, background .2s; }
  .field:focus { border-color:var(--green); background:#fff; }
  textarea.field { min-height:84px; resize:vertical; }
  .btn { width:100%; background:linear-gradient(135deg,var(--green),var(--green2)); color:#fff; padding:15px; border-radius:16px; font-weight:800; font-size:1.05rem; margin-top:16px; box-shadow:0 10px 22px rgba(5,150,105,.28); }
  .btn.light { background:var(--bg); color:var(--ink); box-shadow:none; }
  .btn:disabled { opacity:.6; }
  .err { color:var(--danger); font-weight:700; margin-top:10px; }
  .cod { background:var(--mint); color:var(--green2); padding:12px 14px; border-radius:14px; font-weight:700; margin-top:14px; }

  .center { text-align:center; padding:60px 20px; color:var(--muted); }
  .done { text-align:center; padding:16px 6px; }
  .done .big { font-size:3.6rem; animation:pop .6s var(--ease) both; }
  .spinner { width:38px; height:38px; border:4px solid #CBD5E1; border-top-color:var(--green); border-radius:50%; animation:spin 1s linear infinite; margin:0 auto 12px; }

  @keyframes spin { to { transform:rotate(360deg); } }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes fade { from { opacity:0; } to { opacity:1; } }
  @keyframes pop { 0% { opacity:0; transform:scale(.6); } 100% { opacity:1; transform:scale(1); } }
  @keyframes up { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:none; } }
  @keyframes bump { 0% { transform:scale(1); } 40% { transform:scale(1.35); } 100% { transform:scale(1); } }
  @keyframes shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }
  @keyframes pulse { 0% { box-shadow:0 0 0 0 rgba(52,211,153,.7); } 70% { box-shadow:0 0 0 9px rgba(52,211,153,0); } 100% { box-shadow:0 0 0 0 rgba(52,211,153,0); } }
  @media (prefers-reduced-motion:reduce) { *,*::before { animation:none !important; transition:none !important; } html { scroll-behavior:auto; } }
</style>
</head>
<body dir="rtl">

<header>
  <div class="wrap">
    <div class="bar">
      <div class="langs">
        <button data-l="ckb">کوردی</button>
        <button data-l="ar">عربي</button>
        <button data-l="en">EN</button>
      </div>
    </div>
    <div class="brandline">
      <div class="logo" id="logo">🛒</div>
      <div style="min-width:0">
        <h1 class="shopname" id="shopName">…</h1>
        <div class="meta" id="meta"></div>
      </div>
    </div>
    <div class="actions" id="actions"></div>
  </div>
</header>

<main>
  <div class="tools" id="tools">
    <div class="search">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>

  <div class="pager hidden" id="pager"></div>

  <section class="about hidden" id="about"></section>

<div class="cartbar hidden" id="cartbar">

<div class="toast" id="toast"></div>

<div class="sheet-bg hidden" id="sheetBg">

</div>

// Name of our app (shown at the bottom: "made with ..."). Change here when the final name is chosen.
const APP_NAME = 'Shop POS';
const PER_PAGE = 20;

const $ = (id) => document.getElementById(id);
const slug = (new URLSearchParams(location.search).get('s') || '').trim().toLowerCase();
let store = null, items = [], photos = {}, cart = {}, cat = '', lang = 'ckb', sending = false, page = 1;
const loadedPacks = new Set(), loadingPacks = new Set();
// Photos are loaded in small packs only when the customer scrolls near them.
const io = ('IntersectionObserver' in window) ? new IntersectionObserver((entries) => {
  entries.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); loadPack(Number(e.target.dataset.pk)); } });
}, { rootMargin: '600px' }) : null;

function store_get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function store_set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function t(k) { return (T[lang] || T.en)[k] || T.en[k] || k; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// Firestore REST values
function dec(v) {
  if (!v || typeof v !== 'object') return null;
  if ('stringValue' in v) return v.stringValue;
  if ('integerValue' in v) return Number(v.integerValue);
  if ('doubleValue' in v) return Number(v.doubleValue);
  if ('booleanValue' in v) return v.booleanValue;
  if ('timestampValue' in v) return new Date(v.timestampValue);
  if ('nullValue' in v) return null;
  if ('mapValue' in v) { const o = {}; const f = v.mapValue.fields || {}; for (const k in f) o[k] = dec(f[k]); return o; }
  if ('arrayValue' in v) return (v.arrayValue.values || []).map(dec);
  return null;
}
function enc(v, intKeys) {
  if (v === null || v === undefined) return { nullValue: null };
  if (v instanceof Date) return { timestampValue: v.toISOString() };
  if (typeof v === 'boolean') return { booleanValue: v };
  if (typeof v === 'number') return { doubleValue: v };
  if (typeof v === 'string') return { stringValue: v };
  if (Array.isArray(v)) return { arrayValue: { values: v.map(x => enc(x, intKeys)) } };
  const fields = {};
  for (const k in v) fields[k] = (intKeys && intKeys.includes(k) && typeof v[k] === 'number') ? { integerValue: String(Math.round(v[k])) } : enc(v[k], intKeys);
  return { mapValue: { fields } };
}
function fieldsOf(doc) { const o = {}; const f = (doc && doc.fields) || {}; for (const k in f) o[k] = dec(f[k]); return o; }

function money(n) {
  const d = (store && store.decimals) || 0;
  const s = new Intl.NumberFormat('en', { minimumFractionDigits: d, maximumFractionDigits: d }).format(n || 0);
  return `${s} ${(store && store.currency) || ''}`.trim();
}


function setLang(l) {
  lang = T[l] ? l : 'en';
  const rtl = lang !== 'en';
  document.documentElement.lang = lang;
  document.documentElement.dir = rtl ? 'rtl' : 'ltr';
  document.body.dir = rtl ? 'rtl' : 'ltr';
  document.querySelectorAll('.langs button').forEach(b => b.classList.toggle('on', b.dataset.l === lang));
  $('q').placeholder = t('search');
  $('stateText').textContent = t('loading');
  $('openCart').textContent = t('viewCart');
  $('powered').textContent = t('powered');
  $('privacyLink').textContent = t('privacy');
  $('madeWith').textContent = t('madeWith');
  $('appName').textContent = APP_NAME;
  $('createOwn').textContent = t('createOwn');
  store_set('shop_lang', lang);
  render();
}
document.querySelectorAll('.langs button').forEach(b => b.onclick = () => setLang(b.dataset.l));
$('q').oninput = () => { page = 1; renderGrid(true); };

// Search bar gets a glass background when it sticks to the top.
const tools = $('tools');
if ('IntersectionObserver' in window) {
  const sentinel = document.createElement('div');
  tools.before(sentinel);
  new IntersectionObserver(([e]) => tools.classList.toggle('stuck', !e.isIntersecting)).observe(sentinel);
}

async function load() {
  if (!slug) return showState(t('notFound'));
  try {
    const res = await fetch(`${BASE}/stores/${encodeURIComponent(slug)}?key=${API_KEY}`);
    if (res.status === 404 || res.status === 403) return showState(t('notFound'));
    if (!res.ok) throw new Error(res.status);
    store = fieldsOf(await res.json());
  } catch (e) { return showState(t('failed')); }
  items = (store.items || []).filter(i => i && i.n);
  applyOffers();
  cart = store_get(`cart_${slug}`, {});
  for (const k in cart) if (!items.find(i => String(i.k) === k)) delete cart[k];
  $('state').classList.add('hidden');
  document.title = store.shopName || 'Online shop';
  setLang(store_get('shop_lang', null) || store.lang || 'ckb');
  renderGrid(true);
  loadPhotos();
}

async function loadPack(i) {
  if (isNaN(i) || loadedPacks.has(i) || loadingPacks.has(i)) return;
  loadingPacks.add(i);
  try {
    const res = await fetch(`${BASE}/stores/${encodeURIComponent(slug)}/photos/${i}?key=${API_KEY}`);
    if (res.ok) { Object.assign(photos, fieldsOf(await res.json()).p || {}); loadedPacks.add(i); }
  } catch (e) {} finally { loadingPacks.delete(i); }
  fillPhotos();
}

// Put loaded photos into the cards without redrawing the page.
function fillPhotos() {
  document.querySelectorAll('.ph[data-k]').forEach(el => {
    const ph = photos[el.dataset.k];
    if (!ph || el.querySelector('img')) return;
    el.classList.remove('wait');
    const letter = el.querySelector('.letter');
    if (letter) letter.remove();
    const img = new Image();
    img.alt = '';
    img.src = `data:image/jpeg;base64,${ph}`;
    el.prepend(img);
  });
}

function observePhotos() {
  document.querySelectorAll('.ph[data-pk]').forEach(el => {
    if (photos[el.dataset.k]) return;
    const pk = Number(el.dataset.pk);
    if (loadedPacks.has(pk)) return;
    if (io) io.observe(el); else loadPack(pk);
  });
}

function loadPhotos() {
  // Older shop data without pack numbers: load every pack.
  if (!items.some(i => i.pk !== undefined && i.pk !== null)) {
    for (let i = 0; i < (store.photoPacks || 0); i++) loadPack(i);
  }
}

// Discount from the shop app: d = percent, de = last day (yyyy-mm-dd). Ended offers are ignored.
function applyOffers() {
  const now = new Date();
  const today = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
  const f = Math.pow(10, (store && store.decimals) || 0);
  for (const i of items) {
    if (i.d > 0 && i.d < 100 && (!i.de || i.de >= today)) {
      i.op = i.p;
      i.p = Math.round(i.p * (100 - i.d) / 100 * f) / f;
    } else {
      i.d = 0;
    }
  }
}

function showState(text) {
  $('state').classList.remove('hidden');
  $('state').innerHTML = `<div style="font-size:2.8rem">🏪</div><div>${esc(text)}</div>`;
}

// Phone for WhatsApp: 0750 123 4567 → 9647501234567 (Iraq).
function waNumber(p) {
  let d = String(p || '').replace(/[^\d]/g, '');
  if (d.startsWith('00')) d = d.slice(2);
  if (d.startsWith('0') && d.length === 11) d = '964' + d.slice(1);
  return d;
}

function mapLink() {
  if (store.map) return store.map;
  if (store.address) return `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(store.address)}`;
  return '';
}

function render() {
  if (!store) return;
  $('shopName').textContent = store.shopName || '';
  $('logo').textContent = (store.shopName || '🛒').trim().charAt(0).toUpperCase() || '🛒';
  $('meta').innerHTML =
    `<span class="pill ${store.open ? '' : 'closed'}"><span class="dot"></span>${store.open ? t('openNow') : t('closedNow')}</span>` +
    `<span class="pill">🛍️ ${items.length} ${t('items')}</span>` +
    (store.hours ? `<span class="pill">🕒 ${esc(store.hours)}</span>` : '');
  const phone = (store.phone || '').replace(/[^\d+]/g, '');
  const map = mapLink();
  $('actions').innerHTML =
    (phone ? `<a class="act call" href="tel:${esc(phone)}">📞 ${t('call')}</a>` : '') +
    (phone ? `<a class="act wa" href="https://wa.me/${waNumber(phone)}" target="_blank" rel="noopener">💬 ${t('whatsapp')}</a>` : '') +
    (map ? `<a class="act loc" href="${esc(map)}" target="_blank" rel="noopener">📍 ${t('map')}</a>` : '');
  $('notice').classList.toggle('hidden', !!store.open);
  $('notice').innerHTML = `⏸️ <span>${esc(t('closed'))}</span>`;
  renderChips();
  renderGrid(false);
  renderAbout();
  renderCartBar();
}

function renderAbout() {
  const phone = store.phone || '';
  const map = mapLink();
  const blocks = [];
  if (store.address || map) blocks.push(`<div class="ainfo"><div class="aicon">📍</div><div><small>${t('shopAddr')}</small><b>${esc(store.address || '')}</b>
    ${map ? `<br><a class="btnmap" href="${esc(map)}" target="_blank" rel="noopener">🗺️ ${t('map')}</a>` : ''}</div></div>`);
  if (store.hours) blocks.push(`<div class="ainfo"><div class="aicon">🕒</div><div><small>${t('hours')}</small><b>${esc(store.hours)}</b></div></div>`);
  if (phone) blocks.push(`<div class="ainfo"><div class="aicon">📞</div><div><small>${t('contact')}</small><b dir="ltr">${esc(phone)}</b></div></div>`);
  if (store.about) blocks.push(`<div class="ainfo"><div class="aicon">💚</div><div><small>${t('about')}</small><b>${esc(store.about)}</b></div></div>`);
  $('about').classList.toggle('hidden', blocks.length === 0);
  $('about').innerHTML = `<h3>${t('visit')} · ${esc(store.shopName || '')}</h3>` + blocks.join('');
}

function renderChips() {
  const cats = [...new Set(items.map(i => i.c).filter(Boolean))];
  const hasOffers = items.some(i => i.d > 0);
  if (!hasOffers && cat === '__off') cat = '';
  $('chips').classList.toggle('hidden', cats.length === 0 && !hasOffers);
  $('chips').innerHTML = [['', t('all')], ...(hasOffers ? [['__off', t('offers')]] : []), ...cats.map(c => [c, c])]
    .map(([v, l]) => `<button class="chip ${v === '__off' ? 'offers' : ''} ${v === cat ? 'on' : ''}" data-c="${esc(v)}">${esc(l)}</button>`).join('');
  $('chips').querySelectorAll('.chip').forEach(b => b.onclick = () => {
    cat = b.dataset.c; page = 1;
    renderChips(); renderGrid(true); scrollToGrid();
  });
}

function filtered() {
  const q = $('q').value.trim().toLowerCase();
  return items.filter(i => (!cat || (cat === '__off' ? i.d > 0 : i.c === cat)) && (!q || i.n.toLowerCase().includes(q)));
}

function actionHtml(i) {
  const k = String(i.k), qty = cart[k] || 0;
  if (!i.s) return `<button class="add" disabled>${t('out')}</button>`;
  if (qty > 0) return `<div class="stepper"><button data-a="-" data-k="${k}">−</button><span>${qty}</span><button data-a="+" data-k="${k}">+</button></div>`;
  return `<button class="add" data-a="+" data-k="${k}" ${store.open ? '' : 'disabled'}>＋ ${t('add')}</button>`;
}

// animate = cards fade in (new page / search / category). Not when only a quantity changes.
function renderGrid(animate) {
  if (!store) return;
  const shown = filtered();
  const pages = Math.max(1, Math.ceil(shown.length / PER_PAGE));
  if (page > pages) page = pages;
  const start = (page - 1) * PER_PAGE;
  const list = shown.slice(start, start + PER_PAGE);
  $('countLine').classList.toggle('hidden', shown.length === 0);
  $('countLine').textContent = t('showing').replace('{a}', start + 1).replace('{b}', start + list.length).replace('{n}', shown.length);
  const grid = $('grid');
  grid.classList.toggle('anim', !!animate);
  if (!list.length) {
    grid.innerHTML = `<div class="empty"><div>🔎</div>${t('noResults')}</div>`;
  } else {
    grid.innerHTML = list.map((i, n) => {
      const k = String(i.k), ph = photos[k];
      const hasPack = i.pk !== undefined && i.pk !== null;
      const img = ph ? `<img src="data:image/jpeg;base64,${ph}" alt="">` : `<span class="letter">${esc(i.n.trim().charAt(0).toUpperCase())}</span>`;
      const wait = !ph && hasPack ? ' wait' : '';
      const off = i.d > 0 ? `<span class="off">-${i.d}%</span>` : '';
      const sold = !i.s ? `<span class="soldout">${t('out')}</span>` : '';
      const old = i.d > 0 ? `<span class="oldp">${money(i.op)}</span>` : '';
      const until = i.d > 0 && i.de ? `<div class="until">⏳ ${t('until')} <bdi dir="ltr">${esc(i.de)}</bdi></div>` : '';
      return `<div class="card ${i.d > 0 ? 'sale' : ''}" style="--i:${n}">
        <div class="ph${wait}" data-k="${k}"${hasPack ? ` data-pk="${i.pk}"` : ''}>${img}${off}${sold}</div>
        <div class="info"><div class="name">${esc(i.n)}</div><div class="prices"><span class="price">${money(i.p)}</span>${old}</div>${until}
        <div class="act-slot" data-slot="${k}">${actionHtml(i)}</div></div></div>`;
    }).join('');
  }
  wireActions(grid);
  renderPager(pages);
  observePhotos();
}

function wireActions(root) {
  root.querySelectorAll('[data-a]').forEach(b => b.onclick = () => change(b.dataset.k, b.dataset.a === '+' ? 1 : -1));
}

// Page buttons: ‹ 1 … 4 5 6 … 12 ›
function renderPager(pages) {
  const el = $('pager');
  el.classList.toggle('hidden', pages <= 1);
  if (pages <= 1) { el.innerHTML = ''; return; }
  const rtl = document.documentElement.dir === 'rtl';
  const nums = [];
  for (let p = 1; p <= pages; p++) {
    if (p === 1 || p === pages || Math.abs(p - page) <= 1) nums.push(p);
    else if (nums[nums.length - 1] !== '…') nums.push('…');
  }
  el.innerHTML =
    `<button class="nav" data-p="${page - 1}" ${page === 1 ? 'disabled' : ''}>${rtl ? '→' : '←'} ${t('prev')}</button>` +
    nums.map(p => p === '…' ? `<span class="gap">…</span>` : `<button data-p="${p}" class="${p === page ? 'on' : ''}">${p}</button>`).join('') +
    `<button class="nav" data-p="${page + 1}" ${page === pages ? 'disabled' : ''}>${t('next')} ${rtl ? '←' : '→'}</button>`;
  el.querySelectorAll('button[data-p]').forEach(b => b.onclick = () => {
    const p = Number(b.dataset.p);
    if (p < 1 || p > pages || p === page) return;
    page = p;
    renderGrid(true);
    scrollToGrid();
  });
}

function scrollToGrid() {
  const y = $('grid').getBoundingClientRect().top + window.scrollY - 170;
  if (window.scrollY > y) window.scrollTo({ top: Math.max(0, y), behavior: 'smooth' });
}

let toastTimer = null;
function toast(text) {
  const el = $('toast');
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 1400);
}

function change(k, d) {
  const before = cart[k] || 0;
  const n = Math.max(0, Math.min(99, before + d));
  if (n === 0) delete cart[k]; else cart[k] = n;
  store_set(`cart_${slug}`, cart);
  // Update only this item's button (no redraw, no jumping).
  const slot = document.querySelector(`[data-slot="${k}"]`);
  const it = items.find(x => String(x.k) === k);
  if (slot && it) { slot.innerHTML = actionHtml(it); wireActions(slot); }
  if (before === 0 && n > 0) toast(`✓ ${t('added')}`);
  renderCartBar(true);
  if (!$('sheetBg').classList.contains('hidden')) openCart();
}

function cartLines() {
  return Object.entries(cart).map(([k, q]) => {
    const i = items.find(x => String(x.k) === k);
    return i ? { i, q } : null;
  }).filter(Boolean);
}
function subtotal() { return cartLines().reduce((s, l) => s + l.i.p * l.q, 0); }

function renderCartBar(bump) {
  const lines = cartLines();
  const count = lines.reduce((s, l) => s + l.q, 0);
  $('cartbar').classList.toggle('hidden', count === 0);
  $('cartCount').textContent = count;
  $('cartTotal').textContent = money(subtotal());
  if (bump) {
    const c = $('cartCount');
    c.classList.remove('bump'); void c.offsetWidth; c.classList.add('bump');
  }
}
$('openCart').onclick = () => openCart();

let savedScroll = 0;
function closeSheet() {
  $('sheetBg').classList.add('hidden');
  document.body.classList.remove('page-open');
  renderCartBar();
  window.scrollTo(0, savedScroll);
}
function showSheet() {
  const bg = $('sheetBg');
  const wasHidden = bg.classList.contains('hidden');
  if (wasHidden) savedScroll = window.scrollY;
  bg.classList.remove('hidden');
  document.body.classList.add('page-open');
  if (wasHidden) window.scrollTo(0, 0);
}
// Small top bar with a back arrow on the cart / checkout page.
function topBar(title, back) {
  const arrow = document.documentElement.dir === 'rtl' ? '→' : '←';
  return `<div class="sheet-top"><button id="topBack" aria-label="back">${arrow}</button><b>${esc(store.shopName || '')} · ${title}</b></div>`;
}
function wireTop(back) { const b = $('topBack'); if (b) b.onclick = back; }

function openCart() {
  const lines = cartLines();
  showSheet();
  if (!lines.length) {
    $('sheet').innerHTML = topBar(t('cart')) + `<div class="center">${t('empty')}</div><button class="btn light" id="b">${t('back')}</button>`;
    $('b').onclick = closeSheet;
    wireTop(closeSheet);
    return;
  }
  $('sheet').innerHTML = topBar(t('cart')) + lines.map(l => `
    <div class="line"><div class="ln">${esc(l.i.n)}<div class="out">${money(l.i.p)}</div></div>
    <div class="mini"><button data-a="-" data-k="${l.i.k}">−</button><b>${l.q}</b><button data-a="+" data-k="${l.i.k}">+</button></div>
    <div class="lp">${money(l.i.p * l.q)}</div></div>`).join('') +
    `<div class="row big" style="margin-top:8px"><span>${t('subtotal')}</span><span>${money(subtotal())}</span></div>
     <button class="btn" id="go" ${store.open ? '' : 'disabled'}>${t('checkout')}</button>
     <button class="btn light" id="b">${t('back')}</button>`;
  $('sheet').querySelectorAll('[data-a]').forEach(b => b.onclick = () => change(b.dataset.k, b.dataset.a === '+' ? 1 : -1));
  $('go').onclick = checkout;
  $('b').onclick = closeSheet;
  wireTop(closeSheet);
}

function checkout() {
  const saved = store_get('customer', {});
  const cities = (store.cities || []).filter(c => c && c.n);
  const cityField = cities.length
    ? `<select class="field" id="city"><option value="">${t('chooseCity')}</option>${cities.map((c, i) =>
        `<option value="${i}" ${saved.city === c.n ? 'selected' : ''}>${esc(c.n)} — ${c.f > 0 ? money(c.f) : t('free')}</option>`).join('')}</select>`
    : `<input class="field" id="city" value="${esc(saved.city || '')}">`;
  $('sheet').innerHTML = topBar(t('checkout')) + `
    <label>${t('name')}</label><input class="field" id="cn" maxlength="80" value="${esc(saved.name || '')}" autocomplete="name">
    <label>${t('phone')}</label><input class="field" id="cp" maxlength="20" inputmode="tel" dir="ltr" value="${esc(saved.phone || '')}" autocomplete="tel" placeholder="07xx xxx xxxx">
    <label>${t('city')}</label>${cityField}
    <label>${t('address')}</label><textarea class="field" id="ca" maxlength="300" placeholder="${t('addressHint')}">${esc(saved.address || '')}</textarea>
    <label>${t('note')}</label><input class="field" id="cnote" maxlength="200">
    <div class="cod">${t('cod')}</div>
    <div style="margin-top:12px">
      <div class="row"><span>${t('subtotal')}</span><span>${money(subtotal())}</span></div>
      <div class="row"><span>${t('fee')}</span><span id="feeV"></span></div>
      <div class="row big"><span>${t('total')}</span><span id="totV"></span></div>
    </div>
    <div class="err hidden" id="err"></div>
    <button class="btn" id="send">${t('send')}</button>
    <button class="btn light" id="b">${t('back')}</button>`;
  window.scrollTo(0, 0);
  wireTop(() => { if (!sending) openCart(); });
  const fee = () => {
    if (!cities.length) return 0;
    const i = $('city').value;
    return i === '' ? 0 : (cities[Number(i)].f || 0);
  };
  const upd = () => { $('feeV').textContent = fee() > 0 ? money(fee()) : t('free'); $('totV').textContent = money(subtotal() + fee()); };
  if (cities.length) $('city').onchange = upd;
  upd();
  $('b').onclick = () => { if (!sending) openCart(); };
  $('send').onclick = async () => {
    const name = $('cn').value.trim(), phone = $('cp').value.trim(), address = $('ca').value.trim(), note = $('cnote').value.trim();
    const cityName = cities.length ? ($('city').value === '' ? '' : cities[Number($('city').value)].n) : $('city').value.trim();
    const err = (m) => { $('err').textContent = m; $('err').classList.remove('hidden'); };
    if (!name || !phone || !cityName || !address) return err(t('fill'));
    const digits = phone.replace(/[^\d]/g, '');
    if (digits.length < 7 || digits.length > 15) return err(t('badPhone'));
    store_set('customer', { name, phone, city: cityName, address });
    const lines = cartLines();
    const sub = subtotal(), f = fee();
    const order = {
      storeSlug: slug, ownerUid: store.ownerUid, customerName: name, phone, city: cityName, fee: f,
      address, note, subtotal: sub, total: sub + f, status: 'new', createdAt: new Date(),
      items: lines.map(l => ({ k: Number(l.i.k), n: l.i.n, p: l.i.p, q: l.q })),
    };
    sending = true; $('send').disabled = true; $('send').textContent = t('sending');
    try {
      const fields = enc(order, ['k', 'q']).mapValue.fields;
      const res = await fetch(`${BASE}/orders?key=${API_KEY}`, {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ fields }),
      });
      if (res.status === 403) { sending = false; $('send').disabled = false; $('send').textContent = t('send'); return err(t('refused')); }
      if (!res.ok) throw new Error(res.status);
      cart = {}; store_set(`cart_${slug}`, cart);
      renderGrid(); renderCartBar();
      $('sheet').innerHTML = `<div class="done"><div class="big">✅</div><h2>${t('doneTitle')}</h2><p class="out" style="font-size:1rem">${t('doneText')}</p>
        <div style="text-align:start;margin-top:14px">${lines.map(l => `<div class="row"><span>${l.q} × ${esc(l.i.n)}</span><span>${money(l.i.p * l.q)}</span></div>`).join('')}
        <div class="row"><span>${t('fee')}</span><span>${f > 0 ? money(f) : t('free')}</span></div>
        <div class="row big"><span>${t('total')}</span><span>${money(sub + f)}</span></div></div>
        <button class="btn" id="b">${t('again')}</button></div>`;
      window.scrollTo(0, 0);
      $('b').onclick = closeSheet;
    } catch (e) {
      $('send').disabled = false; $('send').textContent = t('send'); err(t('failed'));
    } finally { sending = false; }
  };
}

setLang(store_get('shop_lang', null) || 'ckb');
load();
</script>
</body>
</html>
